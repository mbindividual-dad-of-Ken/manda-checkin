<style>
:root{
  --bg:#f0f0f0;--app:#fff;--card:#f9fafb;--border:#e5e7eb;
  --text:#111;--sub:#6b7280;--muted:#aaa;
  --primary:#4f46e5;--pbg:#ede9fe;--plight:#c7d2fe;
  --danger:#ef4444;--warn:#d97706;
}
body.dark{
  --bg:#0f172a;--app:#1e293b;--card:#293548;--border:#334155;
  --text:#f1f5f9;--sub:#94a3b8;--muted:#64748b;
  --primary:#818cf8;--pbg:#1e1b4b;--plight:#312e81;
  --danger:#f87171;--warn:#fbbf24;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:sans-serif;background:var(--bg);display:flex;justify-content:center;min-height:100vh;transition:background .3s,color .3s}
#app{width:100%;max-width:420px;background:var(--app);min-height:100vh;display:flex;flex-direction:column;transition:background .3s}
#bar{padding:14px 16px 8px;border-bottom:1px solid var(--border)}
#bar h1{font-size:20px;font-weight:700;color:var(--text)}
#bar p{font-size:12px;color:var(--sub);margin-top:2px}
#main{flex:1;overflow-y:auto;padding:14px}
#nav{display:flex;border-top:1px solid var(--border)}
.nb{flex:1;padding:8px 0 10px;border:none;background:var(--app);cursor:pointer;font-size:10px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;transition:color .2s,background .3s;position:relative;overflow:hidden;-webkit-tap-highlight-color:transparent}
.nb.on{color:var(--primary)}
.ni{font-size:18px}
.sec{font-size:10px;font-weight:700;color:var(--sub);letter-spacing:.05em;text-transform:uppercase;margin:14px 0 7px}
.sec:first-child{margin-top:0}

/* Steps */
.steps{display:flex;align-items:center;margin-bottom:14px}
.si{flex:1;display:flex;align-items:center;gap:4px}
.sd{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0}
.sd.done{background:var(--primary);color:#fff}
.sd.go{background:var(--primary);color:#fff;box-shadow:0 0 0 4px var(--plight)}
.sd.wait{background:var(--card);color:var(--muted);border:1px solid var(--border)}
.sl{font-size:10px;color:var(--muted)}
.sl.go{color:var(--primary);font-weight:700}
.sline{width:14px;height:2px;background:var(--border);flex-shrink:0;margin:0 2px}

/* Mandala */
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-bottom:12px}
.mc{border-radius:9px;border:1.5px solid var(--border);padding:7px 5px;cursor:pointer;min-height:68px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;background:var(--card);transition:border-color .15s}
.mc:hover{border-color:var(--plight)}
.mc.fill{background:var(--app)}
.mc.core{background:var(--primary);border-color:var(--primary)}
.mc .tag{font-size:8px;color:var(--muted);margin-bottom:2px}
.mc.core .tag{color:rgba(255,255,255,.65)}
.mc .val{font-size:11px;font-weight:600;color:var(--text);line-height:1.3}
.mc.core .val{color:#fff}
.mc .ph{font-size:20px;color:var(--border)}

/* Sub-grid */
.sb{border-radius:10px;border:1px solid var(--border);margin-bottom:9px;overflow:hidden}
.sbh{display:flex;align-items:center;gap:7px;padding:9px 12px;background:var(--card);border-bottom:1px solid var(--border)}
.sbd{width:8px;height:8px;border-radius:50%}
.sbt{flex:1;font-size:13px;font-weight:600;color:var(--text)}
.sbb{font-size:10px;padding:2px 8px;border-radius:20px}
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;padding:7px}
.sc{border-radius:7px;border:1px solid var(--border);padding:6px 4px;min-height:52px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;cursor:pointer;background:var(--card);transition:border-color .15s}
.sc:hover{border-color:var(--plight)}
.sc.scc{cursor:default}
.scv{font-size:10px;font-weight:600;color:var(--text);line-height:1.3}
.scl{font-size:9px;margin-top:2px;padding:1px 5px;border-radius:10px}
.scu{font-size:9px;color:var(--muted);margin-top:2px}
.scp{font-size:18px;color:var(--border)}

/* Progress */
.pw{display:flex;align-items:center;gap:10px;padding:11px 13px;background:var(--card);border-radius:10px;margin-bottom:9px}
.pbg{flex:1;height:6px;background:var(--border);border-radius:3px;overflow:hidden}
.pf{height:100%;background:var(--primary);border-radius:3px;transition:width .3s}

/* Habit card */
.hc{background:var(--app);border-radius:10px;border:1px solid var(--border);border-left:4px solid var(--primary);padding:11px 12px;margin-bottom:8px}
.hr{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.hn{font-size:13px;font-weight:700;color:var(--text);flex:1}
.hsrc{font-size:9px;padding:2px 6px;border-radius:20px}
.hsk{font-size:10px;padding:2px 7px;border-radius:20px;background:#fef3c7;color:#92400e}
.hd{background:none;border:none;cursor:pointer;font-size:13px;color:var(--muted);padding:2px 4px}
.lg{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px}
.lb{padding:7px 3px;border-radius:7px;border:2px solid var(--border);cursor:pointer;text-align:center;background:var(--card);transition:all .12s;position:relative;overflow:hidden;-webkit-tap-highlight-color:transparent}
.lb:hover{border-color:var(--plight)}
.lbn{font-size:10px;font-weight:700;display:block;color:var(--muted)}
.lbv{font-size:9px;display:block;margin-top:1px;color:var(--muted)}

/* Modal */
#mo{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:999;justify-content:center;align-items:flex-end}
#mo.open{display:flex}
#mb{background:var(--app);border-radius:18px 18px 0 0;padding:20px;width:100%;max-width:420px;max-height:88vh;overflow-y:auto}
.mt{font-size:15px;font-weight:700;color:var(--text);margin-bottom:5px}
.md{font-size:12px;color:var(--sub);margin-bottom:14px;line-height:1.6}
.ml{font-size:11px;color:var(--sub);margin-bottom:4px;display:block}
.mi{width:100%;padding:10px 11px;border-radius:9px;border:1.5px solid var(--border);font-size:14px;color:var(--text);background:var(--card);margin-bottom:12px;font-family:sans-serif}
.mi:focus{outline:none;border-color:var(--plight)}
.msel{width:100%;padding:9px 11px;border-radius:9px;border:1.5px solid var(--border);font-size:13px;color:var(--text);background:var(--card);margin-bottom:12px;font-family:sans-serif}
.mh{font-size:11px;color:var(--sub);background:var(--card);padding:9px 11px;border-radius:9px;margin-bottom:12px;line-height:1.6}
.mbtns{display:flex;gap:7px}
.mbtn{flex:1;padding:11px;border-radius:9px;border:1.5px solid var(--border);font-size:13px;cursor:pointer;font-family:sans-serif;background:var(--app);color:var(--text);font-weight:600}
.mbtn:hover{background:var(--card)}
.mbtn.pri{background:var(--primary);color:#fff;border-color:var(--primary)}
.mbtn.red{color:var(--danger);border-color:#fca5a5}
.swrow{display:flex;gap:7px;margin-bottom:13px;flex-wrap:wrap}
.sw{width:30px;height:30px;border-radius:6px;cursor:pointer;border:3px solid transparent;transition:all .12s}
.sw.on{border-color:var(--text);transform:scale(1.15)}

/* Calendar */
.cn{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px}
.cnb{background:var(--app);border:1.5px solid var(--border);border-radius:8px;padding:5px 13px;cursor:pointer;font-size:13px;color:var(--text);font-family:sans-serif}
.cnb:hover{background:var(--card)}
.cm{font-size:14px;font-weight:700;color:var(--text)}
.cgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:11px}
.cdow{font-size:9px;text-align:center;color:var(--muted);padding:3px 0;font-weight:700}
.cd{aspect-ratio:1;border-radius:5px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;cursor:pointer;color:var(--text)}
.cd:hover{background:var(--card)}
.cd.tod{font-weight:700;box-shadow:inset 0 0 0 2px var(--primary)}
.cd.oth{opacity:.28;pointer-events:none}
.cd.sel{background:var(--pbg);font-weight:700}
.cdd{display:flex;gap:2px;margin-top:2px;flex-wrap:wrap;justify-content:center;max-width:24px}
.cdt{width:3px;height:3px;border-radius:50%;flex-shrink:0}
.cdet{background:var(--card);border-radius:10px;padding:12px;border:1px solid var(--border)}
.cdr{display:flex;align-items:center;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--border)}
.cdr:last-child{border-bottom:none}

/* Add habit */
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:11px}
.chip{font-size:11px;padding:5px 11px;border-radius:20px;border:1.5px solid var(--border);cursor:pointer;background:var(--card);color:var(--sub);transition:all .12s}
.chip:hover{border-color:var(--plight)}
.chip.on{background:var(--pbg);color:var(--primary);border-color:var(--plight)}
.fi{width:100%;padding:9px 11px;border-radius:9px;border:1.5px solid var(--border);font-size:13px;color:var(--text);background:var(--card);margin-bottom:9px;font-family:sans-serif}
.fi:focus{outline:none;border-color:var(--plight)}
.cg{display:grid;grid-template-columns:repeat(8,1fr);gap:5px;margin-bottom:11px}
.cs{aspect-ratio:1;border-radius:5px;cursor:pointer;border:3px solid transparent;transition:all .12s}
.cs.on{border-color:var(--text);transform:scale(1.12)}
.lrow{display:grid;grid-template-columns:46px 1fr 38px;gap:5px;align-items:center;margin-bottom:6px}
.sv{width:100%;padding:12px;background:var(--primary);color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;margin-top:9px;font-family:sans-serif}
.sv:hover{opacity:.9}

/* Settings */
.sblk{background:var(--card);border-radius:10px;padding:3px 13px;margin-bottom:9px;border:1px solid var(--border)}
.srow{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--border)}
.srow:last-child{border-bottom:none}
.slb{font-size:13px;color:var(--text);font-weight:500}
.ssub{font-size:10px;color:var(--muted);margin-top:2px}
.tgl{width:38px;height:22px;border-radius:11px;background:var(--muted);cursor:pointer;position:relative;transition:background .2s;flex-shrink:0;border:none}
.tgl.on{background:var(--primary)}
.tglk{position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.tgl.on .tglk{left:19px}

/* Stats */
.stat-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px}
.stat-card{background:var(--card);border-radius:10px;padding:12px 14px;margin-bottom:8px;border:1px solid var(--border)}
.stat-num{font-size:28px;font-weight:700;color:var(--primary)}
.stat-lbl{font-size:11px;color:var(--sub);margin-top:2px}
.lvl-row{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.lvl-lbl{font-size:11px;color:var(--sub);width:32px;flex-shrink:0}
.lvl-bar-bg{flex:1;height:8px;background:var(--border);border-radius:4px;overflow:hidden}
.lvl-bar{height:100%;border-radius:4px;transition:width .5s}
.lvl-cnt{font-size:11px;color:var(--sub);width:28px;text-align:right;flex-shrink:0}
.mini-heat{display:grid;grid-template-columns:repeat(10,1fr);gap:2px;margin-top:6px}
.mh-cell{aspect-ratio:1;border-radius:2px}

/* 反思欄位 */
.ref-box{margin-top:9px;padding:10px 11px;background:var(--pbg);border-radius:9px;border:1px solid var(--plight);animation:refIn .25s ease}
@keyframes refIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
.ref-title{font-size:11px;font-weight:700;color:var(--primary);margin-bottom:8px}
.ref-chips{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:6px}
.rchip{font-size:11px;padding:4px 10px;border-radius:20px;border:1.5px solid var(--plight);cursor:pointer;background:var(--app);color:var(--primary);transition:all .12s;-webkit-tap-highlight-color:transparent}
.rchip.on{background:var(--primary);color:#fff;border-color:var(--primary)}
.rchip.grn{border-color:#bbf7d0;color:#15803d}
.rchip.grn.on{background:#16a34a;color:#fff;border-color:#16a34a}
.ref-done{font-size:11px;color:var(--primary);margin-top:6px;cursor:pointer;text-decoration:underline;display:inline-block}

/* 14天損失提示橫幅 */
#loss-banner{display:none;background:#fef3c7;border-radius:10px;padding:11px 14px;margin-bottom:10px;border:1px solid #fde68a;position:relative}
#loss-banner.show{display:flex;align-items:flex-start;gap:10px}
#loss-banner .lb-icon{font-size:18px;flex-shrink:0;margin-top:1px}
#loss-banner .lb-body{flex:1}
#loss-banner .lb-title{font-size:12px;font-weight:700;color:#92400e;margin-bottom:3px}
#loss-banner .lb-sub{font-size:11px;color:#92400e;line-height:1.6}
#loss-banner .lb-cta{font-size:11px;font-weight:700;color:#92400e;text-decoration:underline;cursor:pointer;white-space:nowrap;margin-top:4px;display:inline-block}
#loss-banner .lb-close{position:absolute;top:8px;right:10px;font-size:14px;color:#92400e;cursor:pointer;opacity:.6;background:none;border:none;font-family:sans-serif}

/* Timer */
.timer-bar{margin-top:9px;padding:10px 12px;background:var(--card);border-radius:9px;border:1px solid var(--border)}
.timer-display{font-size:28px;font-weight:700;text-align:center;letter-spacing:2px;margin-bottom:8px;font-variant-numeric:tabular-nums;color:var(--text)}
.timer-controls{display:flex;gap:6px;justify-content:center;margin-bottom:8px}
.tbtn{padding:7px 14px;border-radius:8px;border:1.5px solid var(--border);background:var(--app);cursor:pointer;font-size:13px;font-weight:600;font-family:sans-serif;color:var(--text);transition:all .12s}
.tbtn:hover{background:var(--card)}
.tbtn.start{background:var(--primary);color:#fff;border-color:var(--primary)}
.tbtn.stop{background:var(--danger);color:#fff;border-color:var(--danger)}
.timer-presets{display:flex;gap:5px;justify-content:center;flex-wrap:wrap}
.tpreset{padding:4px 10px;border-radius:20px;border:1px solid var(--border);background:var(--card);cursor:pointer;font-size:11px;color:var(--sub);font-family:sans-serif}
.tpreset:hover{border-color:var(--plight);color:var(--primary)}
.tpreset.on{background:var(--pbg);color:var(--primary);border-color:var(--plight)}
.timer-mode-btns{display:flex;margin-bottom:9px;border-radius:8px;overflow:hidden;border:1px solid var(--border)}
.tmode{flex:1;padding:6px;border:none;background:var(--card);cursor:pointer;font-size:12px;font-weight:600;color:var(--muted);font-family:sans-serif}
.tmode.on{background:var(--primary);color:#fff}

#toast{position:fixed;bottom:75px;left:50%;transform:translateX(-50%);background:#1f2937;color:#fff;font-size:13px;padding:9px 20px;border-radius:25px;white-space:nowrap;opacity:0;transition:opacity .25s;pointer-events:none;z-index:9999}
#toast.show{opacity:1}
.empty{text-align:center;padding:36px 20px;color:var(--muted);font-size:13px;line-height:1.8}


/* ── Skeleton 骨架屏 ── */
@keyframes shimmer{0%{background-position:-400px 0}100%{background-position:400px 0}}
.ske{border-radius:8px;background:linear-gradient(90deg,var(--border) 25%,var(--card) 50%,var(--border) 75%);background-size:800px 100%;animation:shimmer 1.4s infinite linear}
.ske-title{height:18px;width:55%;margin-bottom:10px}
.ske-sub{height:12px;width:35%;margin-bottom:16px}
.ske-card{height:80px;margin-bottom:10px}
.ske-row{height:52px;margin-bottom:8px}
.ske-stat{height:64px;border-radius:10px}

/* ── Ripple 觸控回饋 ── */
.ripple-host{position:relative;overflow:hidden;-webkit-tap-highlight-color:transparent}
@keyframes ripple-out{to{transform:scale(4);opacity:0}}
.ripple-wave{position:absolute;border-radius:50%;background:rgba(255,255,255,.35);transform:scale(0);animation:ripple-out .5s linear;pointer-events:none}

/* ── 成就動畫 ── */
@keyframes burst{0%{transform:scale(0);opacity:1}60%{transform:scale(1.2);opacity:1}100%{transform:scale(1.5);opacity:0}}
@keyframes confetti-fall{0%{transform:translateY(-20px) rotate(0deg);opacity:1}100%{transform:translateY(80px) rotate(360deg);opacity:0}}
@keyframes milestone-in{0%{transform:translateY(40px) scale(.9);opacity:0}100%{transform:translateY(0) scale(1);opacity:1}}
.elite-burst{pointer-events:none;position:fixed;z-index:9990;width:60px;height:60px;border-radius:50%;background:radial-gradient(circle,#fbbf24,#f59e0b)}
.confetti-dot{pointer-events:none;position:fixed;z-index:9989;width:8px;height:8px;border-radius:2px}

/* 里程碑彈窗 */
#milestone-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:9995;justify-content:center;align-items:center;padding:20px}
#milestone-modal.open{display:flex}
#milestone-box{background:var(--app);border-radius:20px;padding:28px 24px;width:100%;max-width:340px;text-align:center;animation:milestone-in .35s ease}
.ms-emoji{font-size:56px;margin-bottom:10px}
.ms-title{font-size:20px;font-weight:800;color:var(--text);margin-bottom:6px}
.ms-sub{font-size:13px;color:var(--sub);line-height:1.7;margin-bottom:20px}
.ms-btn{display:block;width:100%;padding:13px;background:var(--primary);color:#fff;border:none;border-radius:11px;font-size:15px;font-weight:700;cursor:pointer;font-family:sans-serif;margin-bottom:9px}
.ms-skip{font-size:12px;color:var(--muted);cursor:pointer;text-decoration:underline}

/* iOS 安裝引導彈窗 */
#ios-guide{display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:9994;justify-content:center;align-items:flex-end;padding-bottom:env(safe-area-inset-bottom,0)}
#ios-guide.open{display:flex}
#ios-box{background:var(--app);border-radius:20px 20px 0 0;padding:24px 20px 28px;width:100%;max-width:420px}
.ios-title{font-size:17px;font-weight:800;color:var(--text);margin-bottom:14px;text-align:center}
.ios-step{display:flex;align-items:flex-start;gap:12px;margin-bottom:14px}
.ios-num{width:26px;height:26px;border-radius:50%;background:var(--primary);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
.ios-txt{font-size:14px;color:var(--text);line-height:1.6}
.ios-txt b{color:var(--primary)}
.ios-close{display:block;width:100%;padding:12px;background:var(--card);color:var(--text);border:1.5px solid var(--border);border-radius:11px;font-size:14px;font-weight:700;cursor:pointer;font-family:sans-serif;margin-top:6px;text-align:center}

/* PWA：iOS safe area (瀏海/圓角手機) */
#app{padding-bottom:env(safe-area-inset-bottom,0px)}
#nav{padding-bottom:env(safe-area-inset-bottom,0px)}

/* PWA 安裝橫幅 */
#install-banner{display:none;position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:420px;background:var(--primary);color:#fff;padding:12px 16px 16px;z-index:9998;align-items:center;gap:12px;box-shadow:0 -4px 20px rgba(0,0,0,.2)}
#install-banner.show{display:flex}

#install-banner .ib-dismiss{background:rgba(255,255,255,.2);color:#fff}
</style>
</head>

<div id="app">
  <div id="bar"><h1 id="ttl">彈性習慣</h1><p id="tsub"></p></div>
  <div id="main">
    <div id="loss-banner">
      <div class="lb-icon">⚠️</div>
      <div class="lb-body">
        <div class="lb-title">你已連續 14 天打卡 🔥</div>

  </div>

    <button class="nb" id="nb1" onclick="go(1)"><span class="ni">📅</span>月曆</button>
    <button class="nb" id="nb2" onclick="go(2)"><span class="ni">📊</span>統計</button>
    <button class="nb" id="nb3" onclick="go(3)"><span class="ni">➕</span>新增</button>
    <button class="nb" id="nb4" onclick="go(4)"><span class="ni">⚙️</span>設定</button>
  </div>
</div>
<div id="mo" onclick="if(event.target===this)cm()"><div id="mb"></div></div>
<div id="toast"></div>
<script>
/* ── 開發者版權簽名 ── */
// 版權所有 © 2026 Jerry. All Rights Reserved.
// 本程式融合 Stephen Guise《彈性習慣》邏輯與大谷翔平 OW64 曼陀羅框架。
// MANDALA_TALKS_DNA: Elastic-OW64-Resilience-2026
var APP_AUTHOR='Jerry',MANDALA_TALKS_DNA='Elastic-OW64-Resilience-2026';
var SK='eh3',CL=['#7c3aed','#2563eb','#0f766e','#16a34a','#d97706','#dc2626','#db2777','#4b5563'];
var CO=[0,1,2,3,-1,4,5,6,7],tab=0,cY,cM,cSel,aC='#7c3aed';
var TPLS=[
  {n:'閱讀',i:'📚',u:'頁',a:5,b:20,c:50,col:'#7c3aed'},
  {n:'運動',i:'🏃',u:'分鐘',a:10,b:30,c:60,col:'#16a34a'},
  {n:'冥想',i:'🧘',u:'分鐘',a:2,b:10,c:30,col:'#2563eb'},
  {n:'喝水',i:'💧',u:'杯',a:2,b:4,c:8,col:'#0f766e'},
  {n:'寫作',i:'✍️',u:'字',a:100,b:500,c:1000,col:'#d97706'}
];

/* ── 資料 ── */
function ld(){
  try{
    var d=JSON.parse(localStorage.getItem(SK)||'{}');
    if(!d.h)d.h=[];if(!d.l)d.l={};if(!d.s)d.s={};
    if(!d.m)d.m=nm();if(!d.ts)d.ts={};
    return d;
  }catch(e){return{h:[],l:{},s:{},m:nm(),ts:{}};}
}
function sv(d){localStorage.setItem(SK,JSON.stringify(d));}
function nm(){
  return{core:'',
    cells:Array(8).fill(0).map(function(){return{t:'',c:'',hid:''};}),
    subs:Array(8).fill(0).map(function(){return{cells:Array(8).fill(0).map(function(){return{t:'',hid:''};})};})
  };
}
function td(){var d=new Date();return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());}
function ds(d){return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());}
function p2(n){return String(n).padStart(2,'0');}
function e(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(function(){t.classList.remove('show');},2200);}

/* ── 統計輔助 ── */
function sk(logs,hid){
  var s=0,c=new Date();c.setDate(c.getDate()-1);
  for(var i=0;i<365;i++){
    var x=ds(c);
    if(logs[x]&&(logs[x][hid]||0)>=1){s++;c.setDate(c.getDate()-1);}else break;
  }
  return s;
}
function maxStreak(logs,hid){
  var max=0,cur=0,c=new Date();
  for(var i=0;i<365;i++){
    var x=ds(c);
    if(logs[x]&&(logs[x][hid]||0)>=1){cur++;if(cur>max)max=cur;}else cur=0;
    c.setDate(c.getDate()-1);
  }
  return max;
}
function last30Stats(logs,hid){
  var byLevel=[0,0,0],c=new Date();
  for(var i=0;i<30;i++){
    var lv=(logs[ds(c)]||{})[hid]||0;
    if(lv>=1)byLevel[lv-1]++;
    c.setDate(c.getDate()-1);
  }
  var total=byLevel[0]+byLevel[1]+byLevel[2];
  return{total:total,rate:Math.round(total/30*100),byLevel:byLevel};
}
function fsrc(m,hid){
  for(var ci=0;ci<8;ci++)if(m.subs[ci])for(var si=0;si<8;si++)if(m.subs[ci].cells[si]&&m.subs[ci].cells[si].hid===hid)return m.cells[ci]?m.cells[ci].t:'';
  return '';
}

/* ── 導覽 ── */
function go(t){
  tab=t;
  for(var i=0;i<5;i++)document.getElementById('nb'+i).classList.remove('on');
  document.getElementById('nb'+t).classList.add('on');
  cm();
  /* 骨架屏：先渲染佔位，再填入真實內容 */
  var skeletons={
    0:'<div class="ske ske-title"></div><div class="ske ske-sub"></div><div class="ske ske-card"></div><div class="ske ske-card"></div><div class="ske ske-card"></div>',
    1:'<div class="ske ske-title"></div><div class="ske ske-card" style="height:220px"></div>',
    2:'<div class="ske ske-title"></div><div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px"><div class="ske ske-stat"></div><div class="ske ske-stat"></div><div class="ske ske-stat"></div></div><div class="ske ske-card"></div><div class="ske ske-card"></div>',
    3:'<div class="ske ske-title"></div><div class="ske ske-row"></div><div class="ske ske-row"></div><div class="ske ske-row"></div>',
    4:'<div class="ske ske-title"></div><div class="ske ske-card"></div><div class="ske ske-card"></div>'
  };
  document.getElementById('main').innerHTML=skeletons[t]||'';
  requestAnimationFrame(function(){
    if(t===0)rH();else if(t===1)rC();else if(t===2)rSt();else if(t===3)rA();else rS();
  });
}
function cm(){document.getElementById('mo').classList.remove('open');}
function om(html){
  document.getElementById('mb').innerHTML=html;
  document.getElementById('mo').classList.add('open');
  setTimeout(function(){var f=document.querySelector('#mb input[type=text]');if(f)f.focus();},100);
}

/* ── 音效（Web Audio API）── */
function playBeep(){
  try{
    var ctx=new(window.AudioContext||window.webkitAudioContext)();
    [880,1100,1320].forEach(function(freq,i){
      var osc=ctx.createOscillator(),gain=ctx.createGain();
      osc.connect(gain);gain.connect(ctx.destination);
      osc.frequency.value=freq;osc.type='sine';
      var t=ctx.currentTime+i*0.18;
      gain.gain.setValueAtTime(0.3,t);
      gain.gain.exponentialRampToValueAtTime(0.001,t+0.14);
      osc.start(t);osc.stop(t+0.14);
    });
  }catch(e){}
}

/* ── 計時器 ── */
var timers={},shownTimers={};
function getTimer(hid){
  if(!timers[hid]){
    var d=ld(),ts=(d.ts&&d.ts[hid])||{};
    timers[hid]={mode:ts.mode||'countdown',running:false,elapsed:0,target:ts.target||600,startAt:null,interval:null,alerted:false};
  }
  return timers[hid];
}
function saveTimerSettings(hid){
  var tm=timers[hid];if(!tm)return;
  var d=ld();if(!d.ts)d.ts={};
  d.ts[hid]={mode:tm.mode,target:tm.target};sv(d);
}
function timerFmt(secs){
  var m=Math.floor(Math.abs(secs)/60),s=Math.abs(secs)%60;
  return(secs<0?'-':'')+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}
function timerTick(hid){
  var tm=getTimer(hid);if(!tm.running)return;
  var now=Date.now(),elapsed=tm.elapsed+Math.floor((now-tm.startAt)/1000);
  var el=document.getElementById('tdisplay-'+hid);
  if(!el){clearInterval(tm.interval);tm.running=false;return;}
  if(tm.mode==='countdown'){
    var rem=tm.target-elapsed;
    el.textContent=timerFmt(rem);
    el.style.color=rem<=0?'var(--danger)':'var(--text)';
    if(rem<=0&&!tm.alerted){
      tm.alerted=true;playBeep();
      if('Notification'in window&&Notification.permission==='granted')
        new Notification('計時完成！',{body:'習慣計時結束 ⏰'});
    }
  }else{el.textContent=timerFmt(elapsed);el.style.color='var(--text)';}
}
function startTimer(hid){var tm=getTimer(hid);if(tm.running)return;tm.running=true;tm.startAt=Date.now();tm.alerted=false;tm.interval=setInterval(function(){timerTick(hid);},500);renderTimerBtn(hid);}
function pauseTimer(hid){var tm=getTimer(hid);if(!tm.running)return;tm.elapsed+=Math.floor((Date.now()-tm.startAt)/1000);clearInterval(tm.interval);tm.running=false;renderTimerBtn(hid);}
function resetTimer(hid){
  var tm=getTimer(hid);clearInterval(tm.interval);
  tm.running=false;tm.elapsed=0;tm.startAt=null;tm.alerted=false;
  var el=document.getElementById('tdisplay-'+hid);
  if(el){el.textContent=tm.mode==='countdown'?timerFmt(tm.target):'00:00';el.style.color='var(--text)';}
  renderTimerBtn(hid);
}
function renderTimerBtn(hid){
  var tm=getTimer(hid),btn=document.getElementById('tstart-'+hid);if(!btn)return;
  if(tm.running){btn.textContent='暫停';btn.className='tbtn stop';btn.onclick=function(){pauseTimer(hid);};}
  else{btn.textContent='開始';btn.className='tbtn start';btn.onclick=function(){startTimer(hid);};}
}
function setTimerMode(hid,mode){
  var tm=getTimer(hid);resetTimer(hid);tm.mode=mode;saveTimerSettings(hid);
  var el=document.getElementById('tdisplay-'+hid);
  if(el)el.textContent=mode==='countdown'?timerFmt(tm.target):'00:00';
  ['countdown','stopwatch'].forEach(function(m){var b=document.getElementById('tmode-'+hid+'-'+m);if(b)b.className='tmode'+(tm.mode===m?' on':'');});
  var pre=document.getElementById('tpresets-'+hid);if(pre)pre.style.display=mode==='countdown'?'flex':'none';
}
function setPreset(hid,secs){
  var tm=getTimer(hid);resetTimer(hid);tm.target=secs;saveTimerSettings(hid);
  var el=document.getElementById('tdisplay-'+hid);if(el)el.textContent=timerFmt(secs);
  document.querySelectorAll('.tpreset[data-hid="'+hid+'"]').forEach(function(b){b.classList.toggle('on',parseInt(b.dataset.secs)===secs);});
}
function renderTimerHTML(hid){
  var tm=getTimer(hid);
  var presets=[[60,'1分'],[120,'2分'],[300,'5分'],[600,'10分'],[1200,'20分'],[1800,'30分'],[3600,'60分']];
  var h='<div class="timer-bar" id="timerbar-'+hid+'">';
  h+='<div class="timer-mode-btns">';
  h+='<button class="tmode'+(tm.mode==='countdown'?' on':'')+'" id="tmode-'+hid+'-countdown" onclick="setTimerMode(\''+hid+'\',\'countdown\')">⏳ 倒數</button>';
  h+='<button class="tmode'+(tm.mode==='stopwatch'?' on':'')+'" id="tmode-'+hid+'-stopwatch" onclick="setTimerMode(\''+hid+'\',\'stopwatch\')">⏱ 碼錶</button>';
  h+='</div>';
  h+='<div class="timer-display" id="tdisplay-'+hid+'">'+(tm.mode==='countdown'?timerFmt(tm.target):timerFmt(tm.elapsed))+'</div>';
  h+='<div class="timer-controls">';
  h+='<button class="'+(tm.running?'tbtn stop':'tbtn start')+'" id="tstart-'+hid+'" onclick="'+(tm.running?'pauseTimer':'startTimer')+'(\''+hid+'\')">'+(tm.running?'暫停':'開始')+'</button>';
  h+='<button class="tbtn" onclick="resetTimer(\''+hid+'\')">重置</button>';
  h+='</div>';
  h+='<div class="timer-presets" id="tpresets-'+hid+'" style="display:'+(tm.mode==='countdown'?'flex':'none')+'">';
  presets.forEach(function(p){h+='<div class="tpreset'+(tm.target===p[0]?' on':'')+'" data-hid="'+hid+'" data-secs="'+p[0]+'" onclick="setPreset(\''+hid+'\','+p[0]+')">'+p[1]+'</div>';});
  h+='</div></div>';
  return h;
}
function toggleTimer(hid){
  if(shownTimers[hid]){var bar=document.getElementById('timerbar-'+hid);if(bar)bar.parentNode.removeChild(bar);shownTimers[hid]=false;}
  else{var card=document.getElementById('hcard-'+hid);if(card)card.insertAdjacentHTML('beforeend',renderTimerHTML(hid));shownTimers[hid]=true;}
}

/* ── 今日頁面 ── */
function rH(){
  var d=ld(),t=td(),log=d.l[t]||{},m=d.m,n=new Date(),days=['日','一','二','三','四','五','六'];
  document.getElementById('ttl').textContent='彈性習慣';
  document.getElementById('tsub').textContent=n.getFullYear()+'年'+(n.getMonth()+1)+'月'+n.getDate()+'日（週'+days[n.getDay()]+'）';
  var hasA=m.cells.some(function(c){return c&&c.t;});
  var H='<div class="steps">';
  var st=[{n:1,l:'核心目標',d:!!m.core},{n:2,l:'行動領域',d:hasA},{n:3,l:'連結習慣',d:d.h.length>0}];
  st.forEach(function(s,i){
    var a=!s.d&&(i===0||(i>0&&st[i-1].d));
    H+='<div class="si"><div class="sd '+(s.d?'done':a?'go':'wait')+'">'+(s.d?'✓':s.n)+'</div><div class="sl'+(a?' go':'')+'">'+s.l+'</div></div>';
    if(i<2)H+='<div class="sline"></div>';
  });
  H+='</div>';
  H+='<div class="sec">曼陀羅九宮格</div>';
  H+='<div style="font-size:12px;color:var(--muted);margin-bottom:8px">核心目標 ⟶ 8 個行動領域 ⟶ 64 個具體行動（OW64 法則）</div>';
  H+='<div class="mgrid">';
  CO.forEach(function(ci){
    if(ci===-1){H+='<div class="mc core" onclick="oCore()"><div class="tag">核心目標</div><div class="val">'+(m.core?e(m.core):'點此設定')+'</div></div>';}
    else{
      var cell=m.cells[ci]||{},bc=cell.c||(cell.t?'#4f46e5':'var(--border)');
      H+='<div class="mc'+(cell.t?' fill':'')+'" style="border-color:'+bc+'" onclick="oCell('+ci+')">';
      if(cell.t)H+='<div class="tag">領域</div><div class="val">'+e(cell.t)+'</div>';
      else H+='<div class="ph">'+(m.core?'＋':'')+'</div>';
      H+='</div>';
    }
  });
  H+='</div>';
  var filled=[];for(var k=0;k<8;k++)if(m.cells[k]&&m.cells[k].t)filled.push(k);
  if(filled.length){
    H+='<div style="font-size:12px;color:var(--muted);margin-bottom:8px">點執行格填入行動並連結習慣</div>';
    filled.forEach(function(ci){
      var cell=m.cells[ci],sub=m.subs[ci],bc=cell.c||'#4f46e5';
      var lc=sub?sub.cells.filter(function(c){return c&&c.hid;}).length:0;
      H+='<div class="sb"><div class="sbh"><div class="sbd" style="background:'+bc+'"></div><div class="sbt">'+e(cell.t)+'</div><div class="sbb" style="background:'+bc+'20;color:'+bc+'">'+(lc?lc+'個習慣':'未連結')+'</div></div>';
      H+='<div class="sgrid">';
      CO.forEach(function(sci){
        if(sci===-1){H+='<div class="sc scc" style="background:'+bc+'15;border-color:'+bc+'"><div class="scv" style="color:'+bc+'">'+e(cell.t)+'</div></div>';}
        else{
          var sc=(sub&&sub.cells[sci])||{},lh=sc.hid?d.h.find(function(x){return x.id===sc.hid;}):null;
          H+='<div class="sc" onclick="oSub('+ci+','+sci+')">';
          if(sc.t){H+='<div class="scv">'+e(sc.t)+'</div>';if(lh)H+='<div class="scl" style="background:'+(lh.col||bc)+'20;color:'+(lh.col||bc)+'">'+lh.i+' '+lh.n+'</div>';else H+='<div class="scu">未連結</div>';}
          else H+='<div class="scp">＋</div>';
          H+='</div>';
        }
      });
      H+='</div></div>';
    });
  }
  if(d.h.length){
    var done=d.h.filter(function(x){return(log[x.id]||0)>=1;}).length;
    var pct=Math.round(done/d.h.length*100);
    H+='<div class="sec" style="margin-top:14px">今日習慣</div>';

function expJSON(){
  var d=ld();
  var blob=new Blob([JSON.stringify(d,null,2)],{type:'application/json'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);

function expCSV(){
  var d=ld();
  var rows=[['日期'].concat(d.h.map(function(h){return h.n;}))];
  Object.keys(d.l).sort().forEach(function(date){
    var row=[date];
    d.h.forEach(function(hb){
      var lv=(d.l[date]||{})[hb.id]||0;
      row.push(lv===0?'':lv===1?'今日的1':lv===2?'穩定前進':'全力以赴');
    });
    rows.push(row);
  });
  var csv='\uFEFF'+rows.map(function(r){return r.join(',');}).join('\n');
  var blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='彈性習慣記錄_'+td()+'.csv';a.click();URL.revokeObjectURL(a.href);
  toast('✓ CSV 已下載');
}
function impJSON(input){
  var file=input.files[0];if(!file)return;
  var reader=new FileReader();
  reader.onload=function(ev){
    try{
      var data=JSON.parse(ev.target.result);
      if(!data.h||!data.l)throw new Error();
      if(confirm('確定匯入？現有資料將被覆蓋。')){sv(data);toast('✓ 匯入成功');go(0);}
    }catch(err){toast('❌ 檔案格式錯誤');}
  };
  reader.readAsText(file);input.value='';
}

/* ── Ripple 觸控回饋 ── */
function addRipple(e){
  var el=e.currentTarget;
  var r=el.getBoundingClientRect();
  var size=Math.max(r.width,r.height);
  var x=(e.clientX||r.left+r.width/2)-r.left-size/2;
  var y=(e.clientY||r.top+r.height/2)-r.top-size/2;
  var wave=document.createElement('span');
  wave.className='ripple-wave';
  wave.style.cssText='width:'+size+'px;height:'+size+'px;left:'+x+'px;top:'+y+'px';
  el.appendChild(wave);
  wave.addEventListener('animationend',function(){wave.remove();});
}
/* 動態綁定 ripple 到 nav 按鈕和習慣卡片（每次 rH 後呼叫）*/
function bindRipples(){
  document.querySelectorAll('.nb,.lb,.sv,.mbtn').forEach(function(el){
    el.removeEventListener('click',addRipple);
    el.addEventListener('click',addRipple);
  });
}

function eliteBurst(el){
  if(!el)return;
  var r=el.getBoundingClientRect();
  var cx=r.left+r.width/2,cy=r.top+r.height/2;
  var ball=document.createElement('div');
  ball.className='elite-burst';
  ball.style.cssText='left:'+(cx-30)+'px;top:'+(cy-30)+'px;animation:burst .55s ease forwards';
  document.body.appendChild(ball);
  setTimeout(function(){ball.remove();},600);
  var colors=['#4f46e5','#f59e0b','#10b981','#ef4444','#8b5cf6','#06b6d4'];
  for(var i=0;i<12;i++){
    (function(idx){
      var dot=document.createElement('div');
      dot.className='confetti-dot';
      var angle=idx*(360/12),dist=40+Math.random()*30;
      var dx=Math.cos(angle*Math.PI/180)*dist,dy=Math.sin(angle*Math.PI/180)*dist;
      dot.style.cssText='left:'+(cx-4)+'px;top:'+(cy-4)+'px;background:'+colors[idx%colors.length]+';transform-origin:center';
      document.body.appendChild(dot);
      dot.animate([
        {transform:'translate(0,0) scale(1)',opacity:1},
        {transform:'translate('+dx+'px,'+dy+'px) scale(0)',opacity:0}
      ],{duration:700,easing:'ease-out'}).onfinish=function(){dot.remove();};
    })(i);
  }
}

var MILESTONES=[7,14,30,66,100];
function checkMilestone(hid,streak){
  if(MILESTONES.indexOf(streak)===-1)return;
  var shown=JSON.parse(localStorage.getItem('ms-shown')||'{}');
  var key=hid+'-'+streak;
  if(shown[key])return;
  shown[key]=true;localStorage.setItem('ms-shown',JSON.stringify(shown));
  var emoji=streak>=100?'🏆':streak>=66?'💎':streak>=30?'🌟':streak>=14?'🔥':'🎉';
  var title=streak>=100?'傳奇習慣家！':streak>=66?'習慣大師！':streak>=30?'一個月不間斷！':streak>=14?'兩週連續！':'一週達成！';
  var sub=streak===66
    ?'你已連續 66 天完成習慣！\nJerry（開發者）留言：「成為不可阻擋的英雄，從每一個「今天的1」開始。你做到了。」'
    :'你已連續 '+streak+' 天完成習慣。\n「不完美但持續」正是彈性習慣的核心精神！';
  var q=QUOTES[Math.floor(Math.random()*QUOTES.length)];
  document.getElementById('ms-emoji').textContent=emoji;
  document.getElementById('ms-title').textContent=title;
  document.getElementById('ms-sub').textContent=sub;
  document.getElementById('ms-quote').textContent='「'+q.q+'」';
  document.getElementById('ms-quote-src').textContent='— '+q.src;
  document.getElementById('milestone-modal').classList.add('open');
  if(typeof gtag!=='undefined')gtag('event','milestone_reached',{streak:streak,habit_id:hid});
}

function isIOS(){return/iphone|ipad|ipod/i.test(navigator.userAgent);}
function isInStandaloneMode(){return window.matchMedia('(display-mode: standalone)').matches||(window.navigator.standalone===true);}

}

var deferredPrompt=null;
window.addEventListener('beforeinstallprompt',function(e){
  e.preventDefault();deferredPrompt=e;
  var b=localStorage.getItem('ib-dismissed');
  if(!b){setTimeout(function(){document.getElementById('install-banner').classList.add('show');},800);}
});
function doInstall(){
  if(deferredPrompt){deferredPrompt.prompt();deferredPrompt.choice.then(function(){deferredPrompt=null;});trackInstall();}
  document.getElementById('install-banner').classList.remove('show');
}
function dismissBanner(){document.getElementById('install-banner').classList.remove('show');localStorage.setItem('ib-dismissed','1');}
window.addEventListener('appinstalled',function(){document.getElementById('install-banner').classList.remove('show');trackInstall();});
